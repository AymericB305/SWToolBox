@if (me()) {
  <p-select
    [options]="me()?.guilds"
    optionLabel="name"
    optionValue="id"
    [(ngModel)]="selectedGuildId"
  >
    <ng-template #footer>
      <div class="p-3">
        <p-button label="Create new guild" fluid severity="secondary" text size="small" icon="pi pi-plus" />
      </div>
    </ng-template>
  </p-select>
}
